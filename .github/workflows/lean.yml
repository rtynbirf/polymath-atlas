name: Lean CI (Gestalt)

# Официальный CI сообщества Lean: https://github.com/leanprover/lean-action
# Workflow сконфигурирован УСЛОВНО: пока в корне нет lean-toolchain / Lakefile.lean,
# job молча пропускается — CI всегда зелёный. Как только вы положите Gestalt/
# рядом с lean-toolchain, сборка и проверка sorry/axioms запустятся автоматически.

on:
  push:
    branches: [main]
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'Lakefile.lean'
      - 'lakefile.toml'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - '**/*.lean'
      - 'lean-toolchain'
      - 'Lakefile.lean'
      - 'lakefile.toml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Skip gracefully if no Lean project present
        id: guard
        run: |
          if [ -f lean-toolchain ] && { [ -f Lakefile.lean ] || [ -f lakefile.toml ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Lean project detected — starting lean-action"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No lean-toolchain/Lakefile in repo root — skipping (expected until Gestalt/ is added)"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.guard.outputs.run == 'true'

      - uses: leanprover/lean-action@v1
        if: steps.guard.outputs.run == 'true'
        with:
          # Сборка + тесты + линт; падает на любом `sorry` при `use-github-cache`
          auto-config: true
          use-github-cache: true

      - name: Audit — assert zero `sorry` in Gestalt sources
        if: steps.guard.outputs.run == 'true'
        run: |
          if grep -rn "sorry" --include="*.lean" .; then
            echo "::error::Found `sorry` in Lean sources — Documentum Imperiale forbids it"
            exit 1
          else
            echo "OK: zero `sorry` — audit standard preserved"
          fi

permissions:
  contents: read
